services:
  postgres:
    image: postgres:16
    container_name: audit-log-postgres
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_log"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
